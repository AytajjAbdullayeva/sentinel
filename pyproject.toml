[project]
name = "sentinel"
version = "0.0.1"
description = "Attack-path intelligence for Solidity protocols"
requires-python = ">=3.11"
dependencies = [
    "web3>=7",
    "solc-select>=1.0",
    "slither-analyzer>=0.11",
    "fastapi>=0.110",
    "pyjwt>=2.8",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "networkx>=3", "httpx>=0.27"]

[project.scripts]
sentinel = "sentinel.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "chain: needs a local anvil binary",
    "fixtures: needs fetched external fixtures (scripts/fetch_fixtures.sh)",
]
